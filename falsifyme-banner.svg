<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">FalsifyMe</title>
  <desc id="desc">Read-only Falsifikations-Gateway mit sichtbarer Terminal-Beobachtung</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101d32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e6b0"/>
      <stop offset="1" stop-color="#62a8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <path d="M0 250 L180 170 L330 235 L500 120 L690 210 L840 95 L1010 180 L1200 90 V320 H0Z" fill="#142744" opacity=".42"/>
  <g transform="translate(72 72)" filter="url(#glow)">
    <rect x="0" y="0" width="132" height="132" rx="22" fill="#0b1729" stroke="url(#accent)" stroke-width="4"/>
    <path d="M34 49 L62 76 L34 103" fill="none" stroke="#43e6b0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 103 H101" stroke="#62a8ff" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g font-family="Consolas, Menlo, monospace">
    <text x="250" y="132" fill="#f3f7ff" font-size="64" font-weight="700">FALSIFYME</text>
    <text x="254" y="178" fill="#8fa8c7" font-size="24">READ-ONLY FALSIFICATION GATEWAY</text>
    <text x="254" y="226" fill="url(#accent)" font-size="22">&gt; observe · verify · decide</text>
  </g>
  <g transform="translate(1030 46)" font-family="Consolas, Menlo, monospace" font-size="18" fill="#8fa8c7">
    <text y="0">PID: LIVE</text>
    <text y="30">SLOTS: 3</text>
    <text y="60">MODE: RO</text>
  </g>
  <path d="M72 276 H1128" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
  <circle cx="1100" cy="276" r="6" fill="#43e6b0"/>
</svg>
