<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">FALSIFYME — Claim, Contradiction, Re-evaluation</title>
  <desc id="desc">FalsifyMe makes a claim from evidence. Evil Twin attacks the claim explicitly. FalsifyMe re-evaluates the claim and only then can the gate open.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="0.58" stop-color="#0a1220"/><stop offset="1" stop-color="#05070d"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#49f0bd"/><stop offset="1" stop-color="#76b8ff"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff536f"/><stop offset="1" stop-color="#c61f45"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#7186a3" opacity="0.34"><text x="34" y="34">loop_events → evidence → verdict</text><text x="34" y="298">read-only · append-only truth · fail-closed</text><text x="1014" y="34">DOKI // OBSERVER</text></g>
  <g font-family="Consolas, Menlo, monospace"><text x="44" y="104" font-size="48" font-weight="800" letter-spacing="1" fill="#f3f7ff">FALSIFY<tspan fill="url(#mint)">_ME</tspan></text><text x="47" y="133" font-size="13" letter-spacing="3" fill="#8299b7">THE SYSTEM THAT ARGUES WITH ITSELF</text></g>
  <g transform="translate(44 164)"><rect width="304" height="92" rx="14" fill="#0b1726" stroke="#1c3550"/><circle cx="22" cy="24" r="5" fill="#49f0bd" filter="url(#glow)"/><text x="38" y="28" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8da6c6">FALSIFYME / CLAIM</text><text x="20" y="56" font-family="Inter, Arial, sans-serif" font-size="16" fill="#eaf2ff">„Die Behauptung hält.“</text><text x="20" y="76" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5f7694">evidence-backed · still falsifiable</text></g>
  <g transform="translate(374 158)"><path d="M0 46 H86" stroke="#2a4664" stroke-width="2"/><path d="M33 31 L52 46 L33 61" fill="none" stroke="#49f0bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="46" r="18" fill="#0b1220" stroke="#ff536f" stroke-width="2"/><path d="M92 38 L108 54 M108 38 L92 54" stroke="#ff536f" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(488 164)"><rect width="304" height="92" rx="14" fill="#190d15" stroke="#4d1a2b"/><circle cx="22" cy="24" r="5" fill="#ff536f" filter="url(#glow)"/><text x="38" y="28" font-family="Consolas, Menlo, monospace" font-size="12" fill="#ff8ba0">EVIL TWIN / WIDERSPRUCH</text><text x="20" y="56" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff0f3">„Nein. Das ist falsch.“</text><line x1="20" y1="45" x2="205" y2="45" stroke="#ff536f" stroke-width="3" stroke-linecap="round"/><text x="20" y="76" font-family="Consolas, Menlo, monospace" font-size="11" fill="#b96a7e">independent attack · no shared reasoning</text></g>
  <g transform="translate(828 164)"><rect width="320" height="92" rx="14" fill="#17170e" stroke="#4a3d20"/><circle cx="22" cy="24" r="5" fill="#ffc65d"/><text x="38" y="28" font-family="Consolas, Menlo, monospace" font-size="12" fill="#e3bd72">FALSIFYME / RE-EVALUATE</text><text x="20" y="56" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff6d8">„Dann war meine Aussage zu stark.“</text><text x="20" y="76" font-family="Consolas, Menlo, monospace" font-size="11" fill="#aa9364">claim rewritten from surviving evidence</text></g>
  <path d="M1134 272 C1082 303 1018 303 968 274 C914 244 853 244 815 270" fill="none" stroke="#ffc65d" stroke-width="2" stroke-dasharray="5 6"/><path d="M815 270 L830 260 L828 279 Z" fill="#ffc65d"/>
  <g transform="translate(505 25)" font-family="Consolas, Menlo, monospace"><rect width="190" height="34" rx="17" fill="#08101a" stroke="#24384e"/><circle cx="18" cy="17" r="4" fill="#ff536f"/><text x="30" y="22" font-size="11" fill="#9fb3ce">WRITE GATE</text><text x="162" y="22" font-size="11" text-anchor="end" fill="#ffb454">RETHINK FIRST</text></g>
  <text x="600" y="306" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2" fill="#a5b8d0">CLAIM → CONTRADICTION → RE-EVALUATION</text>
</svg>
